version: '3.8'

services:
  # 1. The State Machine (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: rce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: rce_sandbox
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rce-network

  # 2. The Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: rce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rce-network

  # 3. The Object Storage (MinIO / Local S3)
  minio:
    image: minio/minio
    container_name: rce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web UI Console Port
    volumes:
      - minio_data:/data
    networks:
      - rce-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  rce-network:
    driver: bridge